# Source catalog: provenance for every dataset that enters BusinessPulse AI.
# `is_synthetic: true` datasets are generated locally and are NEVER real company data.

sources:
  uci_online_retail_ii:
    title: "Online Retail II"
    provider: "UCI Machine Learning Repository"
    url: "https://archive.ics.uci.edu/dataset/502/online+retail+ii"
    download_url: "https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip"
    doi: "10.24432/C5CG6D"
    creator: "Daqing Chen"
    license: "CC BY 4.0"
    is_synthetic: false
    coverage: "2009-12-01 to 2011-12-09 (two Excel sheets)"
    grain: "Invoice line (one product on one invoice)"
    description: >
      All transactions of a UK-based, registered non-store online retailer that mainly
      sells unique all-occasion giftware; many customers are wholesalers.
    columns: [Invoice, StockCode, Description, Quantity, InvoiceDate, Price, "Customer ID", Country]
    limitations:
      - "Single sales channel (online). No physical stores exist in this data, so store/channel comparisons are not available from actual data."
      - "No product cost, so gross profit / margin cannot be computed from actual data."
      - "No product category; categories are derived by documented keyword rules on Description."
      - "~23% of lines have no Customer ID (guest/unidentified); they count toward revenue but not customer metrics."
      - "Cancellations are invoices prefixed 'C' with negative quantity; there is no separate returns system."
      - "No customer registration, segment or loyalty attributes; these are derived (first purchase date, RFM)."
      - "December 2011 is a partial month (ends 2011-12-09)."
      - "Prices are in GBP (pounds sterling)."
    used_for: [sales, customers, products, geography, returns, demand]

  fx_rates_frankfurter:
    title: "Foreign exchange reference rates (ECB via Frankfurter API)"
    provider: "Frankfurter (open-source API over European Central Bank reference rates)"
    url: "https://www.frankfurter.app/docs/"
    license: "ECB reference rates are free to reuse; Frankfurter is MIT-licensed open source"
    is_synthetic: false
    coverage: "Monthly averages derived from daily ECB rates for the transaction period"
    grain: "Month x currency"
    limitations:
      - "Optional. Requires internet access; the platform runs without it and reports GBP only."
      - "ECB reference rates are indicative, not the rates the retailer actually transacted at."
    used_for: [currency_conversion_reporting]

  synthetic_inventory:
    title: "Synthetic inventory snapshot (DEMONSTRATION ONLY)"
    provider: "Generated by businesspulse.ingestion.synthetic (seeded, reproducible)"
    license: "Generated - no external license"
    is_synthetic: true
    coverage: "Single as-of snapshot dated at the end of the transaction data"
    grain: "Product x warehouse"
    description: >
      No public inventory dataset exists for this retailer. Stock levels, reorder levels and
      supplier lead times are randomly generated for the real product catalogue so the
      inventory workflows can be demonstrated. They do NOT describe the retailer's real
      inventory history and are never joined to past transactions as if they were.
    limitations:
      - "Synthetic. Stockout/overstock indicators are illustrations of method, not findings."
      - "Inventory turnover uses real unit sales over a synthetic average-stock assumption and is labelled synthetic."
    used_for: [inventory_demo]

  synthetic_marketing:
    title: "Synthetic marketing campaigns (DEMONSTRATION ONLY)"
    provider: "Generated by businesspulse.ingestion.synthetic (seeded, reproducible)"
    license: "Generated - no external license"
    is_synthetic: true
    coverage: "Monthly campaigns spanning the transaction period"
    grain: "Campaign x day"
    description: >
      No public marketing data exists for this retailer. Campaign cost, impressions, clicks,
      conversions and attributed revenue are generated from funnel assumptions. They are not
      linked to actual transactions, and ROAS/CAC computed from them is NOT the retailer's real
      marketing performance.
    limitations:
      - "Synthetic. Use only to demonstrate marketing analytics methods."
    used_for: [marketing_demo]
