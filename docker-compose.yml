# BusinessPulse AI - local platform.
#   Core (always):     postgres, redis, minio, airflow (CeleryExecutor: webserver, scheduler, worker), app
#   Optional profiles: streaming (kafka), bi (superset), monitoring (prometheus, grafana, exporter),
#                      ml (mlflow), lineage (marquez)
#
#   docker compose up -d                                     # core
#   docker compose --profile monitoring --profile bi up -d   # + optional services
#
# Credentials come from .env (copy .env.example) - nothing is hardcoded here.

x-airflow-common: &airflow-common
  build: {context: ., dockerfile: docker/airflow.Dockerfile}
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/businesspulse/airflow/dags
    BP_DATA_DIR: /opt/businesspulse/data
    BP_WAREHOUSE_PATH: /opt/businesspulse/data/warehouse/businesspulse.duckdb
    BP_APP_DB_PATH: /opt/businesspulse/data/state/app_state.sqlite
    BP_STORAGE_BACKEND: s3
    BP_S3_BUCKET: businesspulse-lake
    BP_S3_ENDPOINT_URL: http://minio:9000
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    BP_POSTGRES_DSN: host=postgres dbname=businesspulse user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}
  volumes:
    - ./:/opt/businesspulse
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    minio: {condition: service_healthy}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: businesspulse
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./warehouse/migrations/postgres_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"], interval: 10s, retries: 10}
    ports: ["5432:5432"]

  redis:
    image: redis:7
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, retries: 10}

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck: {test: ["CMD", "mc", "ready", "local"], interval: 10s, retries: 10}

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} && mc mb --ignore-existing local/businesspulse-lake"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow db migrate && (airflow users create --username admin --password $${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@example.invalid || true)"]

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    depends_on: {airflow-init: {condition: service_completed_successfully}}

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on: {airflow-init: {condition: service_completed_successfully}}

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    depends_on: {airflow-init: {condition: service_completed_successfully}}

  app:
    build: {context: ., dockerfile: docker/app.Dockerfile}
    env_file: .env
    environment:
      BP_DATA_DIR: /opt/businesspulse/data
      BP_WAREHOUSE_PATH: /opt/businesspulse/data/warehouse/businesspulse.duckdb
      BP_APP_DB_PATH: /opt/businesspulse/data/state/app_state.sqlite
    volumes: ["./data:/opt/businesspulse/data"]
    ports: ["8501:8501"]

  # ----------------------------------------------------------- optional: streaming
  kafka:
    profiles: [streaming]
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]

  # ----------------------------------------------------------- optional: self-service BI
  superset:
    profiles: [bi]
    image: apache/superset:4.1.1
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    volumes: ["./monitoring/superset/bootstrap.sh:/app/bootstrap.sh:ro"]
    command: ["/bin/sh", "/app/bootstrap.sh"]
    ports: ["8088:8088"]
    depends_on: [postgres]

  # ----------------------------------------------------------- optional: monitoring
  metrics-exporter:
    profiles: [monitoring]
    build: {context: ., dockerfile: docker/app.Dockerfile}
    environment:
      BP_DATA_DIR: /opt/businesspulse/data
      BP_WAREHOUSE_PATH: /opt/businesspulse/data/warehouse/businesspulse.duckdb
      BP_APP_DB_PATH: /opt/businesspulse/data/state/app_state.sqlite
    volumes: ["./data:/opt/businesspulse/data"]
    command: ["python", "-m", "businesspulse.monitoring.metrics", "--serve", "9108"]

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    volumes: ["./monitoring/prometheus:/etc/prometheus:ro"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  # ----------------------------------------------------------- optional: ML tracking / lineage
  mlflow:
    profiles: [ml]
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/mlflow", "--artifacts-destination", "s3://businesspulse-lake/mlflow"]
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports: ["5000:5000"]
    depends_on: [postgres, minio]

  marquez:
    profiles: [lineage]
    image: marquezproject/marquez:0.50.0
    environment:
      MARQUEZ_PORT: 5002
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: postgres
      POSTGRES_DB: marquez
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5002:5002"]
    depends_on: [postgres]

volumes:
  pg-data:
  minio-data:
