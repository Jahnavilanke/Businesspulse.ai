# Deploys the app to a Hugging Face Docker Space on every push to main.
#
# One-time setup (repository Settings -> Secrets and variables -> Actions):
#   secret   HF_TOKEN  - a Hugging Face access token with "write" permission
#   variable HF_SPACE  - the Space id, e.g. <hf-username>/businesspulse
#
# The Space repository needs the Dockerfile and a README with Spaces front-matter at its
# root, so this job copies them from deploy/huggingface/ into a throwaway snapshot commit
# (author = the author of the GitHub commit being deployed) and force-pushes that.
name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-huggingface
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Space snapshot
        run: |
          AUTHOR_NAME="$(git log -1 --format=%an)"
          AUTHOR_EMAIL="$(git log -1 --format=%ae)"
          SRC_SHA="$(git rev-parse --short HEAD)"
          rm -rf .git
          cp deploy/huggingface/Dockerfile Dockerfile
          cp deploy/huggingface/README.md README.md
          git init -q -b main
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git add -A
          git commit -q -m "Deploy ${SRC_SHA} from GitHub"

      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          HF_USER="${HF_SPACE%%/*}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
